<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roast &amp; Co. — Café app screens</title>
<style>
:root{--bg:#f7f1e6;--card:#fffaf2;--ink:#2b1d16;--mute:#8a7566;--esp:#2f1f17;--car:#c8873f;--lat:#ecdcc2;--sage:#7d9168;--line:#eadfcc}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#ece2d0;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,40px) clamp(12px,3vw,32px) 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;margin-bottom:clamp(22px,3.5vw,40px)}
h1{font-size:clamp(20px,3vw,28px);letter-spacing:-.02em}
header p{font-size:13.5px;color:var(--mute);margin-top:4px}
.seg{display:flex;background:#e0d3bd;border-radius:12px;padding:4px;gap:2px}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:#6c5645;padding:8px 16px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--esp);color:#fff}
.stage{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:44px 24px}
.slide{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
.box{position:relative}
.ph{position:absolute;width:320px;height:660px;transform-origin:0 0;border-radius:46px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 8px #2b1d16,0 0 0 9px #4a3629,0 34px 60px -22px rgba(60,35,15,.5)}
.cap{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.cap b{width:26px;height:26px;border-radius:50%;background:var(--esp);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px}
.stage.walk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;scrollbar-width:none}
.stage.walk::-webkit-scrollbar{display:none}
.stage.walk .slide{flex:0 0 100%;scroll-snap-align:center}
.ctl{display:none;align-items:center;justify-content:center;gap:14px;margin-top:22px}
.ctl.on{display:flex}
.ctl button{font:inherit;width:42px;height:42px;border-radius:50%;border:0;background:var(--esp);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ctl button.pl{width:auto;padding:0 16px;border-radius:21px;font-size:13px;font-weight:600;background:var(--car)}
.pg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:220px}
.pg b{width:7px;height:7px;border-radius:4px;background:#cdbb9d;transition:.25s}.pg b.on{width:22px;background:var(--car)}
/* phone internals (320 x 660 design space) */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scr.dk{background:var(--esp);color:#fff}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:92px;height:26px;border-radius:14px;background:#2b1d16;z-index:5}
.sb{height:48px;padding:15px 26px 0;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;flex:none;position:relative;z-index:4}
.sb span{display:flex;gap:6px;align-items:center}
.pad{padding:0 22px}
.t1{font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.t2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.sm{font-size:12.5px;color:var(--mute);line-height:1.5}
.btn{height:52px;border-radius:26px;background:var(--esp);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;flex:none}
.btn.car{background:var(--car)}.btn.gh{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;height:46px}
.ic{width:20px;height:20px;flex:none}
.circ{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 var(--line);flex:none}
.card{background:var(--card);border-radius:20px;box-shadow:0 1px 0 var(--line),0 10px 22px -16px rgba(60,35,15,.35)}
.chip{padding:8px 15px;border-radius:20px;background:var(--card);font-size:12.5px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip.on{background:var(--esp);color:#fff;box-shadow:none}
.row{display:flex;align-items:center;gap:12px}
.nav{margin-top:auto;height:72px;background:var(--card);border-radius:26px 26px 0 0;display:flex;justify-content:space-around;align-items:center;padding:0 10px 6px;box-shadow:0 -12px 30px -20px rgba(60,35,15,.45);flex:none}
.ni{position:relative;color:#b09a85;width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:16px}
.ni.on{color:var(--car);background:#f6e8d3}
.ni u{position:absolute;top:5px;right:5px;background:var(--car);color:#fff;font-size:9.5px;font-weight:700;text-decoration:none;width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:6px}.dots b{width:7px;height:7px;border-radius:4px;background:#d9c8ac}.dots b.on{width:22px;background:var(--car)}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.07)}
.ill{margin:6px 14px 0;height:330px;border-radius:34px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ill i{position:absolute;border-radius:50%}
.price{font-size:14px;font-weight:700}
.plus{width:28px;height:28px;border-radius:50%;background:var(--car);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.plus .ic{width:15px;height:15px}
.tile{width:56px;height:56px;border-radius:16px;background:var(--lat);display:flex;align-items:center;justify-content:center;flex:none}
.pill{padding:9px 0;border-radius:14px;flex:1;text-align:center;font-size:12.5px;font-weight:600;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.pill.on{background:var(--esp);color:#fff;box-shadow:none}
.lab{font-size:13px;font-weight:700;margin:14px 0 8px}
.step{display:flex;gap:14px;align-items:flex-start;position:relative;height:46px}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:-2px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;position:relative;z-index:1}
.dot.d{background:var(--sage);box-shadow:none}.dot.a{background:var(--car);box-shadow:0 0 0 5px #f1dcbc}
.dot .ic{width:13px;height:13px;stroke-width:3}
.map{margin:12px 22px 0;height:196px;border-radius:24px;position:relative;overflow:hidden;background:#e8dfcc;background-image:linear-gradient(rgba(255,255,255,.55) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.55) 1.5px,transparent 1.5px);background-size:34px 34px}
.map i{position:absolute;background:#fffaf2;border-radius:6px}
.mp{position:absolute;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--car);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 12px -4px rgba(60,35,15,.5)}
.mp.s{background:#9b7b60;width:26px;height:26px}.mp .ic{transform:rotate(45deg);width:15px;height:15px;color:#fff}
@media (max-width:420px){.stage{gap:36px 16px}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="cup" viewBox="0 0 100 100"><ellipse cx="50" cy="87" rx="40" ry="7" fill="#e3cfae"/><path d="M72 42h6a9 9 0 010 18h-7" fill="none" stroke="#fffaf2" stroke-width="6" stroke-linecap="round"/><path d="M20 36h52v18c0 17-12 28-26 28S20 71 20 54z" fill="#fffaf2"/><ellipse cx="46" cy="36" rx="26" ry="6" fill="#6b4129"/><path d="M46 32c-4 0-6 2-6 4 0 3 6 5 6 5s6-2 6-5c0-2-2-4-6-4z" fill="#ecdcc2"/><path d="M38 24c-4-5 4-8 0-13M52 24c-4-5 4-8 0-13" stroke="#c8873f" stroke-width="3" fill="none" stroke-linecap="round" opacity=".75"/></symbol>
<symbol id="iced" viewBox="0 0 100 100"><path d="M26 24h48l-6 62H32z" fill="#f6e9d3"/><path d="M29 44h42l-3 42H32z" fill="#8a5a36"/><path d="M29 44h42l-1.2 14H30.2z" fill="#ecdcc2"/><rect x="35" y="28" width="15" height="15" rx="3" fill="#fff" opacity=".75"/><rect x="53" y="34" width="12" height="12" rx="3" fill="#fff" opacity=".65"/><path d="M62 8l-6 44" stroke="#c8873f" stroke-width="5" stroke-linecap="round"/></symbol>
<symbol id="croi" viewBox="0 0 100 100"><path d="M8 66c4-28 24-40 42-40s38 12 42 40c-8 10-20 8-27-3-4 7-11 7-15 0-7 11-19 13-27 3z" fill="#d9a05b"/><path d="M34 38l8 26M50 30v34M66 38l-8 26" stroke="#b87c3c" stroke-width="3.5" stroke-linecap="round" fill="none"/></symbol>
<symbol id="cake" viewBox="0 0 100 100"><path d="M10 68h80v16a4 4 0 01-4 4H14a4 4 0 01-4-4z" fill="#c8873f"/><path d="M10 52h80v16H10z" fill="#fffaf2"/><path d="M10 38a4 4 0 014-4h72a4 4 0 014 4v14H10z" fill="#6b4129"/><circle cx="50" cy="28" r="6.5" fill="#b5483a"/></symbol>
<symbol id="bean" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="24" ry="35" transform="rotate(30 50 50)" fill="#6b4129"/><path d="M45 18c15 20-9 42 6 64" stroke="#2f1f17" stroke-width="4.5" fill="none" stroke-linecap="round" transform="rotate(30 50 50)"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h11v5a5 5 0 01-5 5h-1a5 5 0 01-5-5z"/><path d="M16 11h2a2 2 0 010 4h-2M8 3v3M12 3v3"/></symbol>
<symbol id="i-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24" fill="#c8873f"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
</defs></svg>

<div class="wrap">
  <header>
    <div><h1>Roast &amp; Co. — café app</h1><p>12 screens, from splash to rewards</p></div>
    <div class="seg" id="seg"><button class="on" data-m="o">Overview</button><button data-m="w">Walkthrough</button></div>
  </header>
  <div class="stage" id="stage"></div>
  <div class="ctl" id="ctl"><button id="pv" aria-label="Previous"><svg class="ic"><use href="#i-back"/></svg></button><div class="pg" id="pg"></div><button id="nx" aria-label="Next"><svg class="ic"><use href="#i-chev"/></svg></button><button class="pl" id="pl">Play</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
const I=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`,U=(n,s,x='')=>`<svg viewBox="0 0 100 100" style="width:${s}px;height:${s}px;${x}"><use href="#${n}"/></svg>`;
const sig='<svg width="16" height="10" viewBox="0 0 16 10" fill="currentColor"><rect y="7" width="3" height="3" rx="1"/><rect x="4.3" y="5" width="3" height="5" rx="1"/><rect x="8.6" y="2.5" width="3" height="7.5" rx="1"/><rect x="13" width="3" height="10" rx="1"/></svg><svg width="24" height="11" viewBox="0 0 24 11"><rect x=".5" y=".5" width="20" height="10" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="14" height="7" rx="1.6" fill="currentColor"/><rect x="21.5" y="3.5" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>';
const SB=()=>`<div class="notch"></div><div class="sb"><b>9:41</b><span>${sig}</span></div>`;
const NAV=a=>`<div class="nav">${['home','menu','bag','user'].map(k=>`<div class="ni${k==a?' on':''}">${I(k)}${k=='bag'?'<u>2</u>':''}</div>`).join('')}</div>`;
const HEAD=(t,r='')=>`<div class="pad row" style="margin-top:4px;justify-content:space-between"><div class="row"><div class="circ">${I('back')}</div><div class="t2">${t}</div></div>${r}</div>`;
const LIST=(s,n,d,p)=>`<div class="card row" style="padding:11px 12px 11px 11px"><div class="tile">${U(s,44)}</div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${n}</div><div class="sm" style="font-size:11.5px">${d}</div><div class="price" style="margin-top:3px">${p}</div></div><div class="plus">${I('plus')}</div></div>`;
const ILL=(bg,main,a,b,t,p)=>`<div class="ill" style="background:${bg}"><i style="width:300px;height:300px;background:rgba(255,255,255,.35)"></i><i style="width:210px;height:210px;background:rgba(255,255,255,.4)"></i>${U(main,190,'position:relative')}${U(a,74,'position:absolute;left:22px;bottom:30px;transform:rotate(-12deg)')}${U(b,66,'position:absolute;right:24px;top:36px;transform:rotate(10deg)')}</div>
<div class="pad" style="margin-top:22px"><div class="dots">${p}</div><div class="t1" style="margin-top:16px">${t}</div></div>`;
const ONB=(bg,m,a,b,t,txt,p,last)=>`<div class="scr">${SB()}${ILL(bg,m,a,b,t,p)}<div class="pad sm" style="margin-top:10px;font-size:13.5px">${txt}</div><div class="pad row" style="margin-top:auto;padding-bottom:30px;gap:14px"><div style="width:64px;font-weight:600;font-size:14px;color:var(--mute)">${last?'':'Skip'}</div><div class="btn" style="flex:1">${last?'Get started':'Next'} ${I('chev')}</div></div></div>`;

const SCREENS=[
['Splash',`<div class="scr dk">${SB()}<div class="ring" style="width:380px;height:380px;left:-30px;top:110px"></div><div class="ring" style="width:560px;height:560px;left:-120px;top:20px"></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;position:relative"><div style="width:96px;height:96px;border-radius:32px;background:var(--car);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5)">${U('bean',60)}</div><div style="text-align:center"><div style="font-size:30px;font-weight:700;letter-spacing:-.02em">Roast &amp; Co.</div><div class="sm" style="color:#cdb8a0;margin-top:6px">Specialty coffee, made your way</div></div></div><div style="display:flex;justify-content:center;padding-bottom:44px"><div class="dots"><b class="on"></b><b></b><b></b></div></div></div>`],
['Welcome · 1',ONB('#ecdcc2','cup','iced','croi','Coffee, your<br>way','Pick your size, milk and extras. Every cup is made fresh for you.','<b class="on"></b><b></b><b></b>')],
['Welcome · 2',ONB('#dfe6d3','croi','cake','cup','Order ahead,<br>skip the queue','Order from your phone and pick it up when it\'s ready.','<b></b><b class="on"></b><b></b>',1)],
['Sign in',`<div class="scr">${SB()}<div class="pad" style="margin-top:6px"><div class="circ">${I('back')}</div><div class="row" style="margin-top:22px;gap:10px"><div style="width:44px;height:44px;border-radius:15px;background:var(--car);display:flex;align-items:center;justify-content:center">${U('bean',28)}</div></div><div class="t1" style="margin-top:20px">Welcome<br>back</div><div class="sm" style="margin-top:8px">Sign in with your phone number to continue.</div><div class="lab" style="margin-top:26px">Phone number</div><div class="card row" style="height:54px;padding:0 16px;gap:12px"><b style="font-size:14px">+880</b><span style="width:1px;height:22px;background:var(--line)"></span><span style="font-size:15px;font-weight:500">1712 345 678</span></div><div class="btn" style="margin-top:18px">Continue</div><div class="row" style="gap:10px;margin:20px 0;color:var(--mute);font-size:12px"><span style="flex:1;height:1px;background:var(--line)"></span>or<span style="flex:1;height:1px;background:var(--line)"></span></div><div class="btn gh">Continue with Google</div><div class="btn gh" style="margin-top:10px">Continue with Apple</div></div><div class="sm pad" style="margin-top:auto;text-align:center;padding-bottom:26px;font-size:11.5px">By continuing you agree to our Terms and Privacy Policy.</div></div>`],
['Choose café',`<div class="scr">${SB()}${HEAD('Pick your café',`<div class="circ">${I('search')}</div>`)}<div class="map"><i style="left:-10px;top:60px;width:340px;height:14px;transform:rotate(-8deg)"></i><i style="left:110px;top:-10px;width:14px;height:220px;transform:rotate(12deg)"></i><i style="left:20px;top:140px;width:300px;height:10px;transform:rotate(6deg)"></i><div class="mp" style="left:84px;top:84px">${I('menu')}</div><div class="mp s" style="left:210px;top:44px">${I('menu')}</div><div class="mp s" style="left:196px;top:128px">${I('menu')}</div></div><div class="pad" style="margin-top:14px;display:flex;flex-direction:column;gap:10px"><div class="card row" style="padding:12px 14px;box-shadow:inset 0 0 0 2px var(--car)"><div class="circ" style="background:#f6e8d3;color:var(--car)">${I('pin')}</div><div style="flex:1"><div style="font-weight:700;font-size:14px">Gulshan 2</div><div class="sm" style="font-size:11.5px">Road 11 · Open until 11 pm</div></div><b style="font-size:12.5px">0.8 km</b></div><div class="card row" style="padding:12px 14px"><div class="circ" style="background:var(--lat)">${I('pin')}</div><div style="flex:1"><div style="font-weight:700;font-size:14px">Banani</div><div class="sm" style="font-size:11.5px">Road 27 · Open until 10 pm</div></div><b style="font-size:12.5px">2.1 km</b></div><div class="card row" style="padding:12px 14px"><div class="circ" style="background:var(--lat)">${I('pin')}</div><div style="flex:1"><div style="font-weight:700;font-size:14px">Dhanmondi</div><div class="sm" style="font-size:11.5px">Road 8 · Open until 11 pm</div></div><b style="font-size:12.5px">4.6 km</b></div></div><div class="pad" style="margin-top:auto;padding-bottom:28px"><div class="btn">Confirm café</div></div></div>`],

n style="color:var(--car)">${I('heart')}</span><span style="flex:1">Favourites</span><span style="color:var(--mute)">${I('chev')}</span></div></div>${NAV('user')}</div>`]

const stage=$('stage'),ctl=$('ctl'),pg=$('pg');
SCREENS.forEach((s,i)=>{const d=document.createElement('div');d.className='slide';d.innerHTML=`<div class="box"><div class="ph">${s[1]}</div></div><div class="cap"><b>${String(i+1).padStart(2,'0')}</b>${s[0]}</div>`;stage.appendChild(d);pg.insertAdjacentHTML('beforeend','<b></b>')});
let idx=0,timer=null;
function fit(){const walk=stage.classList.contains('walk');document.querySelectorAll('.slide').forEach(sl=>{const b=sl.firstElementChild,ph=b.firstElementChild;
 let s=(Math.min(sl.clientWidth,336)-16)/320;if(walk)s=Math.min(s,(innerHeight-250)/660);s=Math.max(.35,Math.min(1,s));
 b.style.width=(320*s+16)+'px';b.style.height=(660*s+16)+'px';ph.style.left=ph.style.top='8px';ph.style.transform=`scale(${s})`})}
function dots(){[...pg.children].forEach((d,i)=>d.classList.toggle('on',i==idx))}
function go(i){idx=(i+SCREENS.length)%SCREENS.length;stage.scrollTo({left:idx*stage.clientWidth,behavior:'smooth'});dots()}
stage.addEventListener('scroll',()=>{if(stage.classList.contains('walk')){idx=Math.round(stage.scrollLeft/stage.clientWidth);dots()}});
function mode(m){const w=m=='w';stage.classList.toggle('walk',w);ctl.classList.toggle('on',w);document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));
 if(!w&&timer){clearInterval(timer);timer=null;$('pl').textContent='Play'}fit();if(w){stage.scrollLeft=0;idx=0;dots()}}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>mode(b.dataset.m));
$('pv').onclick=()=>go(idx-1);$('nx').onclick=()=>go(idx+1);
$('pl').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('pl').textContent='Play'}else{$('pl').textContent='Pause';timer=setInterval(()=>go(idx+1),2600)}};
addEventListener('keydown',e=>{if(!stage.classList.contains('walk'))return;if(e.key=='ArrowRight')go(idx+1);if(e.key=='ArrowLeft')go(idx-1)});
addEventListener('resize',()=>{fit();if(stage.classList.contains('walk'))stage.scrollLeft=idx*stage.clientWidth});
fit();dots();
</script></body></html>
